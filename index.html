<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Links</title>
  <meta name="description" content="All my links in one place.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Links">
  <meta property="og:description" content="All my links in one place.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/onest-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Set theme and the "animations ready" flag before first paint (no flash).
    (function () {
      var d = document.documentElement;
      try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") d.dataset.theme = t; } catch (e) {}
      if (!matchMedia("(prefers-reduced-motion: reduce)").matches) d.classList.add("motion");
    })();
  </script>
  <script defer src="assets/vendor/animbase.min.js"></script>
  <script defer src="config.js"></script>
  <script defer src="assets/icons.js"></script>
  <script defer src="assets/app.js"></script>
</head>
<body>
  <!-- Soft moving gradient, like Telegram chat wallpapers -->
  <div class="wallpaper" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

  <!-- Small glass capsule, like an iOS toolbar -->
  <div class="toolbar">
    <button class="toolbar__btn" type="button" data-action="share" aria-label="Copy page link">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14.5V3.5M8.2 7.2 12 3.4l3.8 3.8"/><path d="M8.5 10.2H7a2 2 0 0 0-2 2v6.3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6.3a2 2 0 0 0-2-2h-1.5"/></svg>
    </button>
    <span class="toolbar__sep" aria-hidden="true"></span>
    <button class="toolbar__btn theme-toggle" type="button" aria-label="Switch theme">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.6A8.2 8.2 0 0 1 9.4 4a8.2 8.2 0 1 0 10.6 10.6Z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>
    </button>
  </div>

  <main class="page">
    <!-- Lock-screen style clock: your local time, so people know when to write -->
    <header class="clock" data-intro="clock">
      <p class="clock__date"></p>
      <p class="clock__time"></p>
      <p class="clock__note"></p>
    </header>

    <div class="groups" data-slot="groups"></div>
    <footer class="footer" data-intro="block"><span data-bind="footer"></span></footer>
  </main>

  <!-- Toast: show → hold → hide in one AnimBase timeline -->
  <div class="toast" role="status" aria-live="polite"
       data-anim-trigger-group="toast"
       data-anim-init='{"opacity": "0", "transform": "translateY(28px) scale(0.9)"}'
       data-anim-config='{"26": {"opacity": "1.out", "transform": "translateY(0px.spring) scale(1.spring)"}, "92": {"opacity": "1", "transform": "translateY(0px) scale(1)"}, "110": {"opacity": "0.in", "transform": "translateY(10px.in) scale(0.96.in)"}}'>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5.5 12.5 4.2 4.2 8.8-9.4"/></svg>
    <span class="toast__text">Copied</span>
  </div>

  <!-- AnimBase timeline settings (frames at 60 fps) -->
  <div hidden data-anim-trigger-group="intro" data-anim-trigger-config='{"speed": 60, "max": 120, "once": true}'></div>
  <div hidden data-anim-trigger-group="toast" data-anim-trigger-config='{"speed": 60, "max": 110, "once": true}'></div>
</body>
</html>
